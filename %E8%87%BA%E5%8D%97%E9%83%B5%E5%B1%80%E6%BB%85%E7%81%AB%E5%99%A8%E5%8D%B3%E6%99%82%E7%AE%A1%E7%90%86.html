<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132139"><title>臺南郵局滅火器即時管理</title>
<style>
:root{--n:#132139;--g:#10b981;--bg:#f3f6fa;--line:#dbe3ec;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{background:var(--n);color:white;padding:20px 16px;position:sticky;top:0;z-index:2}.head{display:flex;gap:12px;align-items:center}.logo{background:#123d3b;color:#58e0b3;border-radius:14px;padding:12px;font-size:24px}h1{font-size:19px;margin:0 0 4px}header p{font-size:12px;color:#c0cddd;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#203752;border-radius:12px;padding:10px}.stat span{display:block;font-size:11px;color:#c0cddd}.stat strong{display:block;font-size:21px;margin-top:3px}main{max-width:760px;margin:auto;padding:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 3px 10px #13213908}h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 10px;background:white;color:#182230;font:inherit;font-size:15px;min-height:44px}textarea{min-height:65px}button{border:0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:700;min-height:40px}.primary{background:var(--g);color:#06392e;width:100%;margin-top:12px}.secondary{background:#e8eef5;color:#26384c}.outline{background:white;border:1px solid var(--line);color:#334155}.danger{background:#fff0f0;color:#b91c1c}.hint{font-size:12px;color:var(--muted);line-height:1.55}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:160px}.toolbar select{width:auto;flex:0 1 auto}.record{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.top{display:flex;justify-content:space-between;gap:8px}.record h3{font-size:15px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted)}.qty{background:#e0f7ee;color:#08734e;font-weight:800;padding:6px 8px;border-radius:8px;white-space:nowrap;font-size:13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.detail{background:#f7f9fc;border-radius:8px;padding:8px;font-size:12px;overflow-wrap:anywhere}.detail b{display:block;color:#64748b;margin-bottom:3px}.note{font-size:12px;color:#475569;margin-top:8px;white-space:pre-wrap}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.actions button{font-size:12px;min-height:32px;padding:6px 10px}.empty{text-align:center;color:var(--muted);padding:22px}.alert{background:#fff7e6;border:1px solid #f7d58b;color:#854d0e;padding:10px;border-radius:9px;font-size:12px;line-height:1.5}#toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17283f;color:white;padding:11px 15px;border-radius:10px;z-index:5;font-size:13px;max-width:90vw}
</style></head><body>
<header><div class="head"><div class="logo">♧</div><div><h1>臺南郵局滅火器管理</h1><p>即時登錄・到期追蹤・快速查詢</p></div></div><div class="stats"><div class="stat"><span>紀錄筆數</span><strong id="countAll">0</strong></div><div class="stat"><span>已知總支數</span><strong id="countQty">0</strong></div><div class="stat"><span>待補到期日</span><strong id="countMissing">0</strong></div></div></header>
<main>
<section class="panel"><h2 id="formTitle">＋ 新增設備紀錄</h2><form id="form"><input id="editId" type="hidden"><div class="grid">
<div class="full"><label for="office">郵局名稱／支局 *</label><input id="office" required placeholder="例如：永康郵局、灣裡支局"></div>
<div><label for="kind">滅火器種類 *</label><select id="kind"><option>二氧化碳滅火器</option><option>ABC 乾粉滅火器</option><option>泡沫滅火器</option><option>水滅火器</option><option>其他</option></select></div>
<div><label for="spec">規格／型式</label><select id="spec"><option>5 型</option><option>10 型</option><option>20 型</option><option>其他／待確認</option></select></div>
<div><label for="qty">數量（支）</label><input id="qty" type="number" min="0" step="1" placeholder="未知可留空"></div>
<div><label for="date">紀錄／新增日期</label><input id="date" type="date"></div>
<div class="full"><label for="expiry">到期日</label><input id="expiry" type="date"><div class="hint">未知可留空。同一批設備到期日不同，請分開登錄。</div></div>
<div class="full"><label for="note">備註</label><textarea id="note" placeholder="例如：全棟設備、已更換新品、舊品回收數量"></textarea></div></div><button class="primary" id="save" type="submit">＋ 儲存紀錄</button><button class="outline" id="cancel" type="button" style="display:none;width:100%;margin-top:8px">取消編輯</button></form></section>
<section class="panel"><h2>設備紀錄清單</h2><div class="toolbar"><input id="search" placeholder="搜尋郵局、種類、規格…"><select id="filter"><option value="all">全部到期狀態</option><option value="missing">待補到期日</option><option value="year">一年內到期</option><option value="expired">已到期</option></select></div><div id="records"></div><p class="hint">數量空白代表待確認，不會當成 0 支加總。</p></section>
<section class="panel"><h2>資料備份與匯出</h2><div class="toolbar"><button class="secondary" id="csv">匯出 CSV（Excel 可開啟）</button><button class="secondary" id="backup">備份全部資料</button><button class="outline" id="import">匯入備份</button><input id="file" type="file" accept=".json,application/json" hidden></div><p class="hint">資料會自動儲存在目前裝置、目前瀏覽器。清除網站資料或更換裝置前，請先備份 JSON。多台裝置同步需要雲端資料庫。</p><div class="alert">起始資料僅包含目前已知紀錄，不代表全臺南市完整郵局名冊。灣裡支局全棟 10 型乾粉滅火器總數待確認。</div></section>
</main><div id="toast" role="status"></div>
<script>
const KEY='tainan_post_office_extinguisher_records_v1';
const initial=[
{id:1,office:'臺南郵局第23支局－灣裡支局',kind:'二氧化碳滅火器',spec:'5 型',qty:1,date:'2026-10-21',expiry:'',note:'新增設備；到期資訊待確認'},
{id:2,office:'臺南郵局第23支局－灣裡支局',kind:'ABC 乾粉滅火器',spec:'10 型',qty:null,date:'',expiry:'2028-04-17',note:'全棟設備；總數待確認'},
{id:3,office:'仁德太子郵局',kind:'二氧化碳滅火器',spec:'5 型',qty:1,date:'',expiry:'',note:'既有紀錄；其他資料待確認'},
{id:4,office:'仁德郵局',kind:'二氧化碳滅火器',spec:'5 型',qty:1,date:'',expiry:'',note:'既有紀錄；其他資料待確認'},
{id:5,office:'仁德後壁厝郵局',kind:'二氧化碳滅火器',spec:'5 型',qty:1,date:'',expiry:'',note:'既有紀錄；其他資料待確認'}];
let data;try{const s=localStorage.getItem(KEY);data=s?JSON.parse(s):initial;if(!Array.isArray(data))data=initial}catch(e){data=initial}
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('儲存失敗，請匯出備份並檢查瀏覽器設定')}}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){if(!s)return '待確認';const [y,m,d]=s.split('-').map(Number);return `${y-1911}年${m}月${d}日`}
function state(r){if(!r.expiry)return 'missing';const today=new Date();today.setHours(0,0,0,0);const d=new Date(r.expiry+'T00:00:00');if(d<today)return 'expired';const lim=new Date(today);lim.setFullYear(lim.getFullYear()+1);return d<=lim?'year':'ok'}
function render(){ $('countAll').textContent=data.length;$('countQty').textContent=data.reduce((s,r)=>s+(r.qty!==null&&r.qty!==''&&r.qty!==undefined?Number(r.qty)||0:0),0);$('countMissing').textContent=data.filter(r=>!r.expiry).length;
const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const rows=data.filter(r=>(r.office+' '+r.kind+' '+r.spec+' '+(r.note||'')).toLowerCase().includes(q)).filter(r=>f==='all'||(f==='missing'&&!r.expiry)||(f==='expired'&&state(r)==='expired')||(f==='year'&&state(r)==='year')).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
$('records').innerHTML=rows.length?rows.map(r=>{const st=state(r),label=st==='expired'?'已到期':st==='year'?'一年內到期':st==='missing'?'待補期限':'期限已登錄';return `<article class="record"><div class="top"><div><h3>${esc(r.office)}</h3><div class="sub">${esc(r.kind)}・${esc(r.spec)}</div></div><div class="qty">${r.qty===null||r.qty===''||r.qty===undefined?'數量待確認':esc(r.qty)+' 支'}</div></div><div class="details"><div class="detail"><b>紀錄／新增日期</b><span>${esc(fmt(r.date))}</span></div><div class="detail"><b>到期日</b><span>${esc(fmt(r.expiry))}</span></div></div><div class="sub" style="margin-top:8px">狀態：<b style="color:${st==='expired'?'#b91c1c':st==='year'?'#b45309':st==='missing'?'#64748b':'#08734e'}">${label}</b></div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}<div class="actions"><button class="outline" onclick="editRecord(${r.id})">編輯</button><button class="danger" onclick="deleteRecord(${r.id})">刪除</button></div></article>`}).join(''):'<div class="empty">沒有符合的紀錄</div>'}
function reset(){ $('form').reset();$('editId').value='';$('formTitle').textContent='＋ 新增設備紀錄';$('save').textContent='＋ 儲存紀錄';$('cancel').style.display='none';$('date').value=new Date().toISOString().slice(0,10)}
$('form').addEventListener('submit',e=>{e.preventDefault();const office=$('office').value.trim(),q=$('qty').value.trim();if(!office)return;if(q!==''&&(!Number.isInteger(Number(q))||Number(q)<0)){toast('數量請輸入非負整數');return}const item={office,kind:$('kind').value,spec:$('spec').value,qty:q===''?null:Number(q),date:$('date').value,expiry:$('expiry').value,note:$('note').value.trim()},id=$('editId').value;if(id){data=data.map(r=>r.id===Number(id)?{...r,...item}:r);toast('已更新紀錄')}else{item.id=Math.max(0,...data.map(r=>Number(r.id)||0))+1;data.unshift(item);toast('已新增並儲存')}persist();reset();render()});
window.editRecord=id=>{const r=data.find(x=>x.id===id);if(!r)return;$('editId').value=r.id;$('office').value=r.office;$('kind').value=r.kind;$('spec').value=r.spec;$('qty').value=r.qty??'';$('date').value=r.date||'';$('expiry').value=r.expiry||'';$('note').value=r.note||'';$('formTitle').textContent='✎ 編輯設備紀錄';$('save').textContent='儲存修改';$('cancel').style.display='block';scrollTo({top:0,behavior:'smooth'})};
window.deleteRecord=id=>{const r=data.find(x=>x.id===id);if(r&&confirm(`確定刪除「${r.office}／${r.kind} ${r.spec}」？`)){data=data.filter(x=>x.id!==id);persist();render();toast('已刪除紀錄')}};
$('cancel').onclick=reset;$('search').oninput=render;$('filter').onchange=render;
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('csv').onclick=()=>{const rows=[['郵局名稱','滅火器種類','規格','數量（支）','紀錄／新增日期','到期日','備註'],...data.map(r=>[r.office,r.kind,r.spec,r.qty??'待確認',r.date||'待確認',r.expiry||'待確認',r.note||''])];download('臺南郵局滅火器紀錄.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8;')};
$('backup').onclick=()=>download('臺南郵局滅火器備份.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),records:data},null,2),'application/json');
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),rows=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(rows))throw 0;if(confirm(`以備份中的 ${rows.length} 筆資料取代目前 ${data.length} 筆？`)){data=rows.map((r,i)=>({...r,id:Number(r.id)||i+1}));persist();render();toast('備份匯入完成')}}catch(err){toast('備份檔格式不正確')}e.target.value=''};
$('date').value=new Date().toISOString().slice(0,10);render();
</script></body></html>
